name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast checks that need no browser.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # The agent skill must match the documents it was written from.
      - run: npm run check:skills
      - run: npm run build
      - run: npm test

  # Known problems in the dependencies. It reads the lock file and needs the network, which the tests do not, so it is
  # its own job and never blocks a change; read its report.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: npm audit --audit-level=critical

  # The suites that drive a real browser. They build their own decks.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # playwright-core has no browser of its own, so download Chromium with its command.
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      # The tests read the browser's path from CHROME_PATH.
      - name: Find Chromium
        run: echo "CHROME_PATH=$(node -p "require('playwright-core').chromium.executablePath()")" >> "$GITHUB_ENV"

      - name: Install the PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils qpdf

      - run: npm run test:e2e
      - run: npm run test:dev
      - run: npm run test:export # includes npm run test:skills, which builds the skill's code samples
