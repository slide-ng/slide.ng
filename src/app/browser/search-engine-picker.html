<div role="radiogroup" class="flex flex-col gap-0.5">
  @for (engine of engines; track engine.url) {
    <button
      type="button"
      role="radio"
      class="flex items-center gap-3 px-2 py-2 rounded-lg text-start hover:bg-active"
      [class.bg-active]="browser.search() === engine.url"
      [attr.aria-checked]="browser.search() === engine.url"
      (click)="browser.setPrefs({ search: engine.url })"
    >
      <span
        class="w-6 h-6 shrink-0 rounded-full bg-white grid place-content-center ring-1 ring-black/10"
      >
        <img class="w-4 h-4" alt="" [src]="engineIcon(engine.url)" />
      </span>
      <span class="flex-1">{{ engine.name }}</span>
      @if (browser.search() === engine.url) {
        <div class="i-ph:check-bold text-[#ff7a3d]"></div>
      }
    </button>
  }
  <button
    type="button"
    role="radio"
    class="flex items-center gap-3 px-2 py-2 rounded-lg text-start hover:bg-active"
    [class.bg-active]="customSearch() || customEditing()"
    [attr.aria-checked]="customSearch()"
    (click)="customEditing.set(true)"
  >
    <span class="w-6 h-6 shrink-0 rounded-full bg-active grid place-content-center">
      <div class="i-ph:magnifying-glass text-sm"></div>
    </span>
    <span class="flex-1">{{ 'browser.customEngine' | t }}</span>
    @if (customSearch()) {
      <div class="i-ph:check-bold text-[#ff7a3d]"></div>
    }
  </button>
  @if (customSearch() || customEditing()) {
    <input
      #customInput
      class="mx-2 mt-1 px-3 py-1.5 rounded-lg border border-main bg-main text-xs outline-none focus:ring-2 focus:ring-[#cc4209]"
      spellcheck="false"
      [placeholder]="'browser.customSearch' | t"
      [value]="customSearch() ? browser.search() : ''"
      (change)="setCustomSearch(customInput)"
    />
  }
</div>
@if (browser.prefs().search !== null) {
  <button
    type="button"
    class="self-start px-2 text-xs op60 hover:op100 underline underline-offset-2"
    (click)="browser.setPrefs({ search: null }); customEditing.set(false)"
  >
    {{ 'browser.deckDefault' | t }}
  </button>
}
