@if (arrow(); as a) {
  <svg class="absolute inset-0 w-full h-full overflow-visible" [style.color]="color()">
    <defs>
      <marker
        [id]="markerId"
        markerWidth="10"
        markerHeight="8"
        refX="8"
        refY="4"
        orient="auto"
        markerUnits="strokeWidth"
      >
        <path d="M0,0 L10,4 L0,8 z" fill="currentColor" />
      </marker>
    </defs>
    <line
      [attr.x1]="a.x1"
      [attr.y1]="a.y1"
      [attr.x2]="a.x2"
      [attr.y2]="a.y2"
      stroke="currentColor"
      [attr.stroke-width]="width()"
      [attr.marker-end]="'url(#' + markerId + ')'"
    />
    @if (editable) {
      <line
        class="drag-grab"
        [attr.x1]="a.x1"
        [attr.y1]="a.y1"
        [attr.x2]="a.x2"
        [attr.y2]="a.y2"
        stroke="transparent"
        stroke-width="16"
        style="pointer-events: stroke; cursor: move"
        (pointerdown)="down($event)"
        (pointermove)="move($event)"
        (pointerup)="up($event)"
        (pointercancel)="up($event)"
      />
    }
  </svg>
}
