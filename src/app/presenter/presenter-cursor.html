@if (point(); as p) {
  @if (p.style === 'laser') {
    <div id="laser-pointer" class="laser-pointer" [style.left.%]="p.x" [style.top.%]="p.y"></div>
  } @else {
    <div
      id="presenter-cursor"
      class="absolute text-black dark:text-white"
      [style.left.%]="p.x"
      [style.top.%]="p.y"
    >
      <div class="i-ph-cursor-fill stroke-white dark:stroke-black" style="stroke-width: 16"></div>
    </div>
  }
}
