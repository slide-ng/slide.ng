@if (ui.overview()) {
  <!-- The page link and the close button are inside the dialog: it is aria-modal, so a screen reader leaves out
           whatever is outside it. -->
  <div
    id="overview"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="'overview.label' | t"
    tabindex="-1"
    class="outline-none fixed inset-0 z-modal select-none text-main"
  >
    <div
      class="absolute inset-0 bg-main bg-opacity-75! px-4 sm:px-16 py-20 overflow-y-auto backdrop-blur-5px"
      (click)="close()"
    >
      <div
        class="grid gap-y-4 gap-x-8 w-full"
        [style.grid-template-columns]="'repeat(auto-fit, minmax(' + cardWidth() + 'px, 1fr))'"
      >
        @for (slide of nav.slides; track $index) {
          <div class="relative">
            <button
              type="button"
              class="overview-card inline-block text-start border rounded overflow-hidden bg-main hover:border-primary transition cursor-pointer"
              [class]="ui.overviewPage() === $index + 1 ? 'border-primary' : 'border-main'"
              [attr.data-no]="$index + 1"
              [attr.aria-label]="
                slide.title
                  ? ('overview.goToTitle' | t: { no: $index + 1, title: slide.title })
                  : ('overview.goTo' | t: { no: $index + 1 })
              "
              [attr.aria-current]="nav.no() === $index + 1 ? 'true' : null"
              (click)="go($index + 1, $event)"
            >
              @defer (on viewport) {
                <app-thumbnail [no]="$index + 1" [width]="cardWidth()" />
              } @placeholder {
                <div
                  [style.width.px]="cardWidth()"
                  [style.height.px]="(cardWidth() * 9) / 16"
                ></div>
              }
            </button>
            <div class="absolute top-0 opacity-65" [style.inset-inline-start.px]="cardWidth() + 5">
              {{ $index + 1 }}
            </div>
          </div>
        }
      </div>
    </div>
    <div class="absolute top-4 end-4 text-gray-400 flex gap-1">
      <a
        id="overview-page-link"
        class="slidev-icon-btn text-2xl"
        [title]="'overview.openPage' | t"
        [attr.aria-label]="'overview.openPage' | t"
        routerLink="/overview"
        (click)="close()"
      >
        <div class="i-carbon:list-boxes"></div>
      </a>
      <button
        icon-btn
        id="overview-close"
        class="text-2xl"
        [title]="'overview.close' | t"
        (click)="close()"
      >
        <div class="i-carbon:close"></div>
      </button>
    </div>
  </div>
}
