<button
  type="button"
  class="slide-ng-timer font-mono tabular-nums cursor-pointer bg-transparent border-0 p-0 text-inherit"
  [class.op50]="timer.status() !== 'running'"
  [attr.aria-label]="(timer.status() === 'running' ? 'timer.pause' : 'timer.start') | t"
  (click)="timer.toggle()"
>
  @if (timer.parts().h) {
    <span>{{ timer.parts().h }}</span
    ><span>:</span>
  }
  <span>{{ timer.parts().m }}</span
  ><span>:</span><span>{{ timer.parts().s }}</span>
</button>
